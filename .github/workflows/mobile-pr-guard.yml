name: Mobile PR guard

# This fork does not build or ship the mobile app. The app in the stores is
# upstream T3 Code's, so a change under apps/mobile/ here has no path to a
# release. This closes those PRs early instead of leaving someone waiting for a
# review that would end in a no.
#
# pull_request_target so the workflow exists on main and runs for forks, which
# is where these PRs come from. Nothing is checked out and no PR code runs: the
# PR number is all it reads, and the comment is a fixed string. The author's
# association is the only input in the job condition, so a fork cannot edit this
# file to opt itself in — the base branch's copy is what runs.
#
# Exempt: OWNER, MEMBER and COLLABORATOR. Those are the people who could push a
# same-repo branch anyway, and the maintainer may want a mobile branch here
# temporarily. Everyone else (including bots) gets the comment and a close.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - "apps/mobile/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  close:
    name: Close the mobile PR
    if: >-
      !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    concurrency:
      group: mobile-pr-guard-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Comment and close
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const pull = context.payload.pull_request;
            const body = [
              "Thanks for the work here. This fork of T3 Code doesn't build or ship a mobile app, so a change under `apps/mobile/` has no way to reach a build or a store release from this repo.",
              "",
              "The app in the App Store and Play Store is upstream T3 Code's — please send mobile changes there: https://github.com/pingdotgg/t3code",
              "",
              "Closing this to save you the wait. Desktop and web changes here are still welcome.",
            ].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pull.number,
              body,
            });
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pull.number,
              state: "closed",
            });
