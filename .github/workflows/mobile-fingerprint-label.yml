name: Mobile Fingerprint Label

# Syncs the "📱 Native Change" label on a pull request, dispatched by hand with
# what mobile-fingerprint-check.yml reported. It used to be the trusted half of
# that per-PR check; both are manual now. This workflow never checks out or
# runs PR code.
#
# platforms is "ios", "android", "ios android", or blank to clear the label.

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: number
      platforms:
        description: Platforms whose native fingerprint changed; blank clears the label
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  label:
    name: Sync native change label
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Sync native change label
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          PR_NUMBER: ${{ inputs.pr }}
          CHANGED_PLATFORMS: ${{ inputs.platforms }}
        with:
          script: |
            const managedLabel = {
              name: "📱 Native Change",
              color: "d93f0b",
              description:
                "Changes the native fingerprint; merging blocks production OTAs until a new store build ships.",
            };
            const nativeChanged = (process.env.CHANGED_PLATFORMS ?? "").trim() !== "";
            const issueNumber = Number(process.env.PR_NUMBER);

            try {
              const { data: existing } = await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: managedLabel.name,
              });

              if (
                existing.color !== managedLabel.color ||
                (existing.description ?? "") !== managedLabel.description
              ) {
                await github.rest.issues.updateLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: managedLabel.name,
                  color: managedLabel.color,
                  description: managedLabel.description,
                });
              }
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }

              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: managedLabel.name,
                  color: managedLabel.color,
                  description: managedLabel.description,
                });
              } catch (createError) {
                if (createError.status !== 422) {
                  throw createError;
                }
              }
            }

            const { data: currentLabels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const hasLabel = currentLabels.some((label) => label.name === managedLabel.name);

            if (nativeChanged && !hasLabel) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: [managedLabel.name],
              });
            } else if (!nativeChanged && hasLabel) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name: managedLabel.name,
                });
              } catch (removeError) {
                if (removeError.status !== 404) {
                  throw removeError;
                }
              }
            }

            core.info(
              `PR #${issueNumber}: native fingerprint ${nativeChanged ? `changed (${process.env.CHANGED_PLATFORMS})` : "unchanged"}`,
            );
