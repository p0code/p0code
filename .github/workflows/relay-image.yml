name: Relay Image

# Publishes the self-hosted relay so a compose file can pull it instead of
# building from a checkout. Pushes to main move `latest`; a vX.Y.Z tag publishes
# that exact version so installs can pin RELAY_VERSION. Every run also pushes
# sha-<short>. Path filters apply to branch pushes only: a tag always builds.

on:
  push:
    branches:
      - main
    # apps/relay/** covers the Dockerfile and the compose file.
    paths:
      - "apps/relay/**"
      - "packages/relay-tunnel/**"
      - ".github/workflows/relay-image.yml"
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

# A newer commit on the same ref wins; a pending multi-arch build is not worth
# finishing once it is superseded.
concurrency:
  group: relay-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build and push
    # Forks cannot write this package, so skip instead of failing red.
    if: github.repository == 'p0code/p0code'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: tags
        run: |
          image=ghcr.io/p0code/p0code-relay
          {
            echo "tags<<EOF"
            echo "$image:sha-${GITHUB_SHA:0:7}"
            case "$GITHUB_REF" in
              refs/heads/main) echo "$image:latest" ;;
              refs/tags/v*) echo "$image:${GITHUB_REF#refs/tags/}" ;;
            esac
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/relay/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # The source label links the GHCR package back to this repository.
          labels: |
            org.opencontainers.image.source=https://github.com/p0code/p0code
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.title=p0code relay
            org.opencontainers.image.description=Self-hosted TCP relay for p0code environments
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
