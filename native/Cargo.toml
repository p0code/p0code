[workspace]
resolver = "3"
members = [
  "crates/p0-protocol",
  "crates/p0-i18n",
  "crates/p0-client",
  "crates/p0-terminal",
  "apps/p0-gpui",
]
exclude = ["resource-monitor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
alacritty_terminal = "0.26.0"
base64 = "0.23.1"
clap = { version = "4.6.10", features = ["derive", "env"] }
dirs = "7.0.0"
futures-util = "0.3.34"
gpui-kit = { version = "0.11.0", features = ["syntect"] }
hex = "0.4.3"
hmac = "0.12.1"
libc = "0.2.191"
http = "1.5.0"
nucleo-matcher = "0.3.1"
pulldown-cmark = "0.13.6"
rand = "0.10.4"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
sys-locale = "0.3.2"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = [
  "macros",
  "rt-multi-thread",
  "sync",
  "time",
  "net",
  "process",
  "fs",
  "io-util",
] }
tokio-tungstenite = "0.30.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.9"
uuid = { version = "1.29.3", features = ["v4"] }
zeroize = "1.9.2"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = 0
opt-level = 1

[profile.release]
codegen-units = 4
lto = "thin"
strip = "symbols"
