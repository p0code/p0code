services:
  relay:
    build:
      context: ../..
      dockerfile: apps/relay/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      RELAY_HOST: ${RELAY_HOST:?Set RELAY_HOST}
      RELAY_ACME_EMAIL: ${RELAY_ACME_EMAIL:?Set RELAY_ACME_EMAIL}
    volumes:
      - relay-data:/data
volumes:
  relay-data:
